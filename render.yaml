services:
  - type: web
    name: laravel-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfile: ./Dockerfile
    buildCommand: docker build -t laravel-api:latest .
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: RENDER
        value: "true"

databases:
  - name: laravel-db
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections
