services:
  - type: web
    name: laravel-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfile: ./Dockerfile
    buildCommand: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
    startCommand: sh -c "php artisan key:generate --force 2>/dev/null || true && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
